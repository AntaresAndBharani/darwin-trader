name: Architect

on:
  issues:
    types: [labeled]

concurrency:
  group: architect-${{ github.event.issue.number }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  id-token: write

env:
  OVERLOAD_RETRY_DELAY_SECONDS: 300

jobs:
  architect:
    runs-on: ubuntu-latest
    if: |
      github.event.label.name == 'status:ready-for-architect' ||
      github.event.label.name == 'status:needs-revision' ||
      github.event.label.name == 'status:needs-clarification'
    env:
      GH_TOKEN: ${{ secrets.ORCHESTRATION_PAT }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      REPO: ${{ github.repository }}
      TRIGGER_LABEL: ${{ github.event.label.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine mode
        id: mode
        run: |
          set -euo pipefail
          IS_STORY=false
          TYPES=$(gh issue view "$ISSUE_NUMBER" -R "$REPO" --json labels -q '[.labels[].name] | join(",")')
          case ",$TYPES," in *,type:user-story,*) IS_STORY=true;; esac

          if [ "$IS_STORY" != "true" ]; then
            echo "mode=skip" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          case "$TRIGGER_LABEL" in
            status:ready-for-architect)  MODE=decompose ;;
            status:needs-revision)       MODE=restructure ;;
            status:needs-clarification)  MODE=answer_clarifications ;;
            *)                           MODE=skip ;;
          esac
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

          IS_BACKLOG_TRIAGE=false
          case ",$TYPES," in *,origin:backlog-triage,*) IS_BACKLOG_TRIAGE=true;; esac
          if [ "$IS_BACKLOG_TRIAGE" = "true" ]; then
            echo "claude_model=claude-sonnet-5" >> "$GITHUB_OUTPUT"
          else
            echo "claude_model=claude-opus-5" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch context (safe via gh/jq)
        if: steps.mode.outputs.mode != 'skip'
        run: |
          set -euo pipefail
          gh issue view "$ISSUE_NUMBER" -R "$REPO" \
            --json number,title,body,labels,comments > issue_context.json

          SUBTASK_NUMS=$(gh api "repos/$REPO/issues/$ISSUE_NUMBER/sub_issues" -q '[.[] | select(.state=="open")] | .[].number')
          if [ -z "$SUBTASK_NUMS" ]; then
            echo "[]" > existing_subtasks.json
          else
            EXISTING="[]"
            for num in $SUBTASK_NUMS; do
              ITEM=$(gh issue view "$num" -R "$REPO" --json number,title,body,labels,comments)
              EXISTING=$(jq -c ". + [$ITEM]" <<< "$EXISTING")
            done
            echo "$EXISTING" > existing_subtasks.json
          fi

      - name: Run Architect (Claude)
        if: steps.mode.outputs.mode != 'skip'
        id: claude
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt_file: .github/workflows/prompts/architect-${{ steps.mode.outputs.mode }}.md
          claude_args: '--model ${{ steps.mode.outputs.claude_model }} --permission-mode dontAsk --allowedTools "Read" "Grep" "Glob" "Write"'

      - name: Handle output
        if: steps.mode.outputs.mode != 'skip' && steps.claude.outcome == 'success' && hashFiles('architect_output.json') != ''
        run: |
          set -euo pipefail
          python3 -c "
          import json, subprocess, os

          with open('architect_output.json') as f:
              data = json.load(f)

          outcome = data.get('outcome', 'PROCEED')
          repo = os.environ['REPO']
          issue_num = os.environ['ISSUE_NUMBER']

          if outcome == 'PO_ESCALATION':
              conflict = data.get('conflict', 'Unknown conflict')
              subprocess.run(['gh', 'issue', 'edit', issue_num, '-R', repo, '--remove-label', 'status:ready-for-architect', '--add-label', 'status:needs-po-input'], check=True)
              subprocess.run(['gh', 'issue', 'comment', issue_num, '-R', repo, '--body', f'**Architect escalation:**\n\n{conflict}'], check=True)
          else:
              subtasks = data.get('subtasks', {}).get('create', [])
              for st in subtasks:
                  title = st['title']
                  if not title.startswith('[Subtask]:'):
                      title = f'[Subtask]: {title}'
                  body = f\"### Task description\n{st.get('task_description','')}\n\n### Files / entry points\n{st.get('entry_points','')}\n\n### Acceptance criteria\n\" + '\n'.join(f'- [ ] {ac}' for ac in st.get('acceptance_criteria',[])) + f\"\n\n### How to verify\n{st.get('verification','')}\"
                  res = subprocess.run(['gh', 'issue', 'create', '-R', repo, '--title', title, '--body', body, '--label', 'type:subtask,status:review'], capture_output=True, text=True, check=True)
                  created_url = res.stdout.strip()
                  created_num = created_url.split('/')[-1]
                  subprocess.run(['gh', 'api', f'repos/{repo}/issues/{issue_num}/sub_issues', '-f', f'sub_issue_id={created_num}'], check=True)

              subprocess.run(['gh', 'issue', 'edit', issue_num, '-R', repo, '--remove-label', 'status:ready-for-architect', '--add-label', 'status:review'], check=True)
          "
