name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Ensure debug keystore
        run: |
          if [ ! -f android/app/debug.keystore ]; then
            keytool -genkey -v -keystore android/app/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build prod APK
        run: cd android && ./gradlew assembleProd --stacktrace

      - name: Rename APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/prod/app-prod.apk dist/darwin-trader-${{ github.ref_name }}.apk || cp android/app/build/outputs/apk/prod/debug/app-prod-debug.apk dist/darwin-trader-${{ github.ref_name }}.apk || cp android/app/build/outputs/apk/prod/release/app-prod-release.apk dist/darwin-trader-${{ github.ref_name }}.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Darwin Trader ${{ github.ref_name }}
          files: dist/darwin-trader-${{ github.ref_name }}.apk
          body: |
            Installable Android APK for Darwin Trader ${{ github.ref_name }}.

            **Install on your phone**
            1. Download the `.apk` below.
            2. Open it; allow "Install unknown apps" for your browser/Files app when prompted.
            3. Tap Install.
